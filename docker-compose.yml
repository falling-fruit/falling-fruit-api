services:
  db:
    image: postgis/postgis:15-3.6
    environment:
      POSTGRES_USER: fallingfruit
      POSTGRES_PASSWORD: fallingfruit
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U fallingfruit"]
      interval: 2s
      timeout: 5s
      retries: 30
