name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Knip
        run: yarn knip

      - name: Type-check
        run: yarn typecheck

      - name: Validate OpenAPI
        run: |
          yarn docs
          if ! git diff --exit-code --stat docs/openapi.yml; then
            echo "::error::Committed docs/openapi.yml is stale. Run 'yarn docs:build' and commit the result."
            exit 1
          fi

      - name: Start database
        run: yarn testdb:up

      - name: Check generated DB types are up to date
        run: |
          yarn codegen:generate
          if ! git diff --exit-code --stat src/db/generated; then
          echo "::error::Generated DB types are stale. Run 'yarn codegen' and commit the result."
            exit 1
          fi

      - name: Run tests
        run: yarn test
