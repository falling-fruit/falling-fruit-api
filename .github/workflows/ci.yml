name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:15-3.6
        env:
          POSTGRES_USER: fallingfruit
          POSTGRES_PASSWORD: fallingfruit
          POSTGRES_DB: fallingfruit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fallingfruit -d fallingfruit_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://fallingfruit:fallingfruit@localhost:5432/fallingfruit_db?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "1"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply migrations
        run: yarn dbmate up

      - name: Check generated DB types are up to date
        run: |
          yarn codegen:generate
          if ! git diff --exit-code --stat src/db/generated; then
          echo "::error::Generated DB types are stale. Run 'yarn codegen' and commit the result."
            exit 1
          fi

      - name: Lint
        run: yarn lint

      - name: Knip
        run: yarn knip

      - name: Type-check
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Validate OpenAPI
        run: |
          yarn docs
          if ! git diff --exit-code --stat docs/openapi.yml; then
            echo "::error::Committed docs/openapi.yml is stale. Run 'yarn docs:build' and commit the result."
            exit 1
          fi
