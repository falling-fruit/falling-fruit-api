    EditReport:
      type: object
      properties:
        location_id:
          type: integer
          minimum: 1
          description: Location ID.
          example: 3383
        problem_code:
          anyOf:
            - type: number
              enum:
                - 0
            - type: number
              enum:
                - 1
            - type: number
              enum:
                - 2
            - type: number
              enum:
                - 3
            - type: number
              enum:
                - 4
            - type: number
              enum:
                - 5
          description: |
            Problem code.
            - 0: Location is spam
            - 1: Location does not exist
            - 2: Location is a duplicate
            - 3: Inappropriate review photo
            - 4: Inappropriate review comment
            - 5: Other (explain below)
          example: 1
        comment:
          type: string
          nullable: true
          minLength: 1
          description: Comment. Required if `problem_code` is 5.
          example: This tree was cut down.
        email:
          allOf:
            - $ref: '#/components/schemas/email'
            - description: 'Email to use for correspondence. If authenticated, defaults to the user''s email. Otherwise, it is required.'
        name:
          type: string
          nullable: true
          minLength: 1
          description: 'Name to use for correspondence. If authenticated, defaults to the user''s name.'
          example: Ethan
      required:
        - location_id
        - problem_code
      title: Report (edit)
      description: Report properties that can be edited.
    Report:
      allOf:
        - $ref: '#/components/schemas/IdField'
        - $ref: '#/components/schemas/EditReport'
        - $ref: '#/components/schemas/DateFields'
        - type: object
          properties:
            reporter_id:
              type: integer
              nullable: true
              minimum: 1
              description: ID of reporting User (if authenticated).
              example: 321
            resolution_code:
              anyOf:
                - type: number
                  enum:
                    - 0
                - type: number
                  enum:
                    - 1
                - type: number
                  enum:
                    - 2
                - type: number
                  enum:
                    - 3
                - type: number
                  enum:
                    - 4
                - type: number
                  enum:
                    - 5
                - nullable: true
              description: |
                Resolution code.
                - 0: Made no changes
                - 1: Edited the location
                - 2: Deleted the location
                - 3: Deleted the photo
                - 4: Deleted the review
                - 5: Hid the location
              example: 2
            response:
              type: string
              nullable: true
              minLength: 1
              description: Response comment.
