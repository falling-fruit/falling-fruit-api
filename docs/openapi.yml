  /user:
    post:
      summary: Register a new user.
      description: |

        When first created, the account is not confirmed and cannot be used.
        An email is sent with a link that must be clicked to confirm the account.

        `email` cannot match (case-insensitive) the email of an existing user. If it does, an alternate email message is sent.
      tags:
        - Authentication
      security:
        - key: []
      parameters:
        - $ref: '#/components/parameters/recaptcha'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BaseUser'
                - type: object
                  properties:
                    email:
                      $ref: '#/components/schemas/email'
                    range:
                      anyOf:
                        - allOf:
                            - $ref: '#/components/schemas/Polygon'
                            - type: object
                              properties: {}
                              description: Foraging range.
                        - nullable: true
                      description: Foraging range.
                    announcements_email:
                      type: boolean
                      default: true
                      description: Whether to receive the email newsletter.
                      example: true
                  required:
                    - email
                    - range
                    - announcements_email
                - type: object
                  properties:
                    password:
                      $ref: '#/components/schemas/password'
                  required:
                    - password
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    minLength: 1
                    example: You will receive an email with instructions for how to confirm your email address in a few minutes
                required:
                  - message
    get:
      summary: View the user (self).
      tags:
        - Authentication
      security:
        - key: []
          token: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - title: User
    put:
      summary: Edit the user (self).
      description: |

        - If a new email is provided, it is staged as unconfirmed (`unconfirmed_email`) and a confirmation email is sent to the new email. The previous email is replaced only once the new email is confirmed. If an account with the new email already exists, a different email is sent.
        - If a password is provided, it takes immediate effect. If it does not match the previous password, all refresh tokens not corresponding to the current access token are revoked.
        - To change email or password, the existing password is required (`password_confirmation`).
      tags:
        - Authentication
      security:
        - key: []
          token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BaseUser'
                - type: object
                  properties:
                    email:
                      $ref: '#/components/schemas/email'
                    range:
                      anyOf:
                        - allOf:
                            - $ref: '#/components/schemas/Polygon'
                            - type: object
                              properties: {}
                              description: Foraging range.
                        - nullable: true
                      description: Foraging range.
                    announcements_email:
                      type: boolean
                      default: true
                      description: Whether to receive the email newsletter.
                      example: true
                  required:
                    - email
                    - range
                    - announcements_email
                - type: object
                  properties:
                    password:
                      $ref: '#/components/schemas/password'
                    password_confirmation:
                      type: string
                      minLength: 1
                      format: password
                      description: Current password. Required for email and password change.
                      example: foo?bar
                  required:
                    - password_confirmation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - title: User
    delete:
