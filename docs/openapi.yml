            responder_id:
              type: integer
              nullable: true
              minimum: 1
              description: ID of responding User.
    Token:
      type: object
      properties:
        access_token:
          type: string
          minLength: 1
          description: Access token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        token_type:
          type: string
