          example: 6bFUlbCG3y1bl5dK6jmv5c45_2FGZchOJzZjvn5766A
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
      title: Token
  parameters:
    bounds:
      schema:
        type: array
        items:
          type: string
          pattern: '^(-?\d+\.?(\d+)?),(-?\d+\.?(\d+)?)$'
        minItems: 2
        maxItems: 2
        description: 'The southwest and northeast corners of the bounding box in WGS84 decimal degrees, in the format `swlat,swlng|nelat,nelng`. Latitude must be in the interval [-90, 90] and longitude must be in the interval [-180, 180]. `swlat` must be less than `nelat`, but `swlng` can be larger than `nelng` if the box crosses the line of 180 degrees longitude.'
        example:
          - '-5,-180'
          - '5,180'
      required: true
      description: 'The southwest and northeast corners of the bounding box in WGS84 decimal degrees, in the format `swlat,swlng|nelat,nelng`. Latitude must be in the interval [-90, 90] and longitude must be in the interval [-180, 180]. `swlat` must be less than `nelat`, but `swlng` can be larger than `nelng` if the box crosses the line of 180 degrees longitude.'
      name: bounds
      in: query
      explode: false
      style: pipeDelimited
    zoom:
      schema:
        type: integer
        minimum: 0
        maximum: 14
        default: 0
        description: 'Zoom level, where the world is divided into a 2<sup>zoom</sup> x 2<sup>zoom</sup> grid.'
      required: false
      description: 'Zoom level, where the world is divided into a 2<sup>zoom</sup> x 2<sup>zoom</sup> grid.'
      name: zoom
      in: query
    muni:
      schema:
        type: boolean
        default: true
        description: Whether to include Locations imported from municipal tree inventories.
      required: false
      description: Whether to include Locations imported from municipal tree inventories.
      name: muni
      in: query
    types:
      schema:
        type: array
        items:
          type: integer
          minimum: 0
        default: null
        description: IDs of Types to include (all by default).
        uniqueItems: true
      required: false
      description: IDs of Types to include (all by default).
      name: types
      in: query
      explode: false
    invasive:
      schema:
        type: boolean
        default: false
        description: Whether to only return Locations with Types locally flagged as invasive species. Note that this parameter is not supported for filtering clusters.
      required: false
      description: Whether to only return Locations with Types locally flagged as invasive species. Note that this parameter is not supported for filtering clusters.
      name: invasive
      in: query
    location_id:
      schema:
        type: integer
        minimum: 1
        description: Location ID.
      required: true
      description: Location ID.
      name: id
      in: path
    location_list_id:
      schema:
        type: integer
        minimum: 1
        description: Location List ID.
      required: true
      description: Location List ID.
      name: list_id
      in: path
    type_id:
      schema:
        type: integer
        minimum: 1
        description: Type ID.
      required: true
      description: Type ID.
      name: id
      in: path
    review_id:
      schema:
        type: integer
        minimum: 1
        description: Review ID.
      required: true
      description: Review ID.
      name: id
      in: path
    user_id:
      schema:
        type: integer
        minimum: 1
        description: User ID.
      required: true
      description: User ID.
      name: id
      in: path
    import_id:
      schema:
        type: integer
        minimum: 1
        description: Import ID.
      required: true
      description: Import ID.
      name: id
      in: path
    recaptcha:
      schema:
        type: string
        minLength: 1
        description: |
          User response token for a Google reCAPTCHA v2 (see https://developers.google.com/recaptcha/docs/verify).
          May be passed as a header or query parameter, or in the request body.
          Only required if user authentication (if available for the endpoint) is not provided.
      required: false
      description: |
        User response token for a Google reCAPTCHA v2 (see https://developers.google.com/recaptcha/docs/verify).
        May be passed as a header or query parameter, or in the request body.
        Only required if user authentication (if available for the endpoint) is not provided.
      name: g-recaptcha-response
      in: header
    offset:
      schema:
        type: integer
        minimum: 0
        default: 0
        description: Offset from which to apply `limit`.
      required: false
      description: Offset from which to apply `limit`.
      name: offset
      in: query
paths:
